<!DOCTYPE html>
<html lang="en">
<head>
  <link rel="manifest" href="manifest.json">
<meta name="theme-color" content="#8A4FFF">
<link rel="apple-touch-icon" href="icons/icon-192.png">
<meta charset="UTF-8" />
<meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no" />

<title>Ruchika AI — Your Intelligent Assistant</title>

<meta name="theme-color" content="#07041a" />
<meta name="mobile-web-app-capable" content="yes" />
<meta name="apple-mobile-web-app-capable" content="yes" />

<link rel="manifest" href="manifest.json" />

<link rel="stylesheet" href="css/style.css" />
<link rel="stylesheet" href="css/animations.css" />
<link rel="stylesheet" href="css/robot.css" />
<link rel="stylesheet" href="css/themes.css" />
<link rel="stylesheet" href="css/responsive.css" />

<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>

<style>
@import url('https://fonts.googleapis.com/css2?family=Poppins:wght@300;400;500;600;700;800&display=swap');

*{
margin:0;
padding:0;
box-sizing:border-box;
font-family:'Poppins',sans-serif;
}

body{
background:#07041a;
overflow:hidden;
height:100vh;
display:flex;
align-items:center;
justify-content:center;
color:#fff;
position:relative;
}

/* Background */
.bg{
position:absolute;
width:100%;
height:100%;
background:
radial-gradient(circle at top left,#8A2FFF33,transparent 30%),
radial-gradient(circle at bottom right,#00D4FF22,transparent 30%),
#07041a;
overflow:hidden;
}

/* Stars */
.star{
position:absolute;
width:2px;
height:2px;
background:white;
border-radius:50%;
animation:twinkle 3s infinite ease-in-out;
}

@keyframes twinkle{
0%,100%{opacity:.2;}
50%{opacity:1;}
}

/* Main Box */
.container{
position:relative;
z-index:2;
width:90%;
max-width:400px;
padding:30px;
border-radius:30px;
background:rgba(255,255,255,0.06);
backdrop-filter:blur(20px);
border:1px solid rgba(255,255,255,0.1);
text-align:center;
box-shadow:0 0 40px rgba(138,47,255,.3);
animation:fadeUp 1s ease;
}

@keyframes fadeUp{
from{
opacity:0;
transform:translateY(40px);
}
to{
opacity:1;
transform:translateY(0);
}
}

/* Logo */
.logo{
font-size:38px;
font-weight:800;
background:linear-gradient(90deg,#8A2FFF,#00D4FF,#FF6B9D);
-webkit-background-clip:text;
-webkit-text-fill-color:transparent;
margin-bottom:10px;
}

/* Tagline */
.tagline{
font-size:14px;
opacity:.8;
margin-bottom:30px;
}

/* Robot */
.robot{
width:140px;
height:140px;
margin:auto;
position:relative;
animation:float 4s ease-in-out infinite;
}

@keyframes float{
0%,100%{
transform:translateY(0);
}
50%{
transform:translateY(-15px);
}
}

.face{
width:100%;
height:100%;
background:#111;
border-radius:35px;
position:relative;
box-shadow:
0 0 25px #8A2FFF,
0 0 50px #8A2FFF66;
border:2px solid #222;
overflow:hidden;
}

.eye{
width:24px;
height:24px;
background:#00D4FF;
border-radius:50%;
position:absolute;
top:45px;
box-shadow:0 0 20px #00D4FF;
animation:blink 5s infinite;
}

.eye.left{
left:35px;
}

.eye.right{
right:35px;
}

@keyframes blink{
0%,45%,100%{
height:24px;
}
48%,52%{
height:5px;
}
}

.mouth{
width:50px;
height:10px;
border-radius:20px;
background:#FF6B9D;
position:absolute;
bottom:35px;
left:50%;
transform:translateX(-50%);
box-shadow:0 0 15px #FF6B9D;
}

.antenna{
width:6px;
height:30px;
background:#777;
position:absolute;
top:-25px;
left:50%;
transform:translateX(-50%);
border-radius:20px;
}

.antenna::after{
content:'';
width:16px;
height:16px;
background:#00D4FF;
position:absolute;
top:-10px;
left:50%;
transform:translateX(-50%);
border-radius:50%;
box-shadow:0 0 20px #00D4FF;
animation:pulse 2s infinite;
}

@keyframes pulse{
0%{
transform:translateX(-50%) scale(1);
opacity:1;
}
50%{
transform:translateX(-50%) scale(1.4);
opacity:.6;
}
100%{
transform:translateX(-50%) scale(1);
opacity:1;
}
}

/* Inputs */
.input{
width:100%;
padding:16px;
border:none;
outline:none;
border-radius:18px;
margin-top:25px;
background:rgba(255,255,255,.08);
color:white;
font-size:15px;
border:1px solid rgba(255,255,255,.1);
}

/* Buttons */
.btn{
width:100%;
padding:16px;
margin-top:15px;
border:none;
border-radius:18px;
font-size:15px;
font-weight:600;
cursor:pointer;
transition:.3s;
}

.google-btn{
background:linear-gradient(90deg,#8A2FFF,#00D4FF);
color:white;
box-shadow:0 0 20px #8A2FFF55;
}

.guest-btn{
background:rgba(255,255,255,.08);
color:white;
border:1px solid rgba(255,255,255,.1);
}

.btn:hover{
transform:scale(1.03);
}

/* Footer */
.footer{
margin-top:25px;
font-size:12px;
opacity:.6;
}
</style>
</head>

<body>

<div class="bg" id="stars"></div>

<div class="container">

<div class="logo">Ruchika AI</div>

<div class="tagline">
Your Intelligent Assistant
</div>

<div class="robot">

<div class="antenna"></div>

<div class="face">

<div class="eye left"></div>
<div class="eye right"></div>

<div class="mouth"></div>

</div>
</div>

<input
type="text"
class="input"
id="username"
placeholder="Enter your name"
/>

<button class="btn google-btn" id="googleLogin">
Continue with Google
</button>

<button class="btn guest-btn" id="guestLogin">
Continue as Guest
</button>

<div class="footer">
Powered by Ruchika AI
</div>

</div>

<script type="module" src="js/firebase.js"></script>
<script type="module" src="js/auth.js"></script>
<script src="js/app.js"></script>

<script>
/* Stars */
const stars = document.getElementById("stars");

for(let i=0;i<80;i++){

const star=document.createElement("div");

star.classList.add("star");

star.style.left=Math.random()*100+"%";
star.style.top=Math.random()*100+"%";

star.style.animationDuration=
(Math.random()*3+2)+"s";

stars.appendChild(star);

}

/* Vibrate */
document.querySelectorAll(".btn").forEach(btn=>{

btn.addEventListener("click",()=>{

if(navigator.vibrate){
navigator.vibrate(50);
}

});

});
</script>

</body>
</html>
