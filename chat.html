<!DOCTYPE html>
<html lang="en">

<head>
<meta charset="UTF-8"/>

<meta
name="viewport"
content="width=device-width,
initial-scale=1.0"/>

<title>Ruchika AI Chat</title>

<link rel="stylesheet"
href="css/style.css"/>

</head>

<body>

<div class="stars" id="stars"></div>

<div class="status-dot"
id="statusDot"></div>

<div class="container">

<h1 class="logo">
Ruchika AI
</h1>

<p class="tagline">
AI Chat Assistant
</p>

<div
class="chat-box"
id="chatBox">

<div class="message ai-message">
Hello 👋<br>
How can I help you today?
</div>

</div>

<input
type="text"
class="input"
id="prompt"
placeholder="Ask anything..."
/>

<button
class="btn btn-primary"
id="sendBtn">
Send Message
</button>

</div>

<button
class="voice-btn"
id="voiceBtn">
🎤
</button>

<script>

// Stars
const stars =
document.getElementById("stars");

for(let i=0;i<80;i++){

const star =
document.createElement("div");

star.classList.add("star");

star.style.left =
Math.random()*100+"%";

star.style.top =
Math.random()*100+"%";

stars.appendChild(star);

}

// Elements
const chatBox =
document.getElementById("chatBox");

const promptInput =
document.getElementById("prompt");

const sendBtn =
document.getElementById("sendBtn");

// Send Message
sendBtn.addEventListener(
"click",
sendMessage
);

async function sendMessage(){

const prompt =
promptInput.value.trim();

if(!prompt) return;

// User Message
const userMsg =
document.createElement("div");

userMsg.className =
"message user-message";

userMsg.innerText =
prompt;

chatBox.appendChild(userMsg);

promptInput.value = "";

// AI Loading
const aiMsg =
document.createElement("div");

aiMsg.className =
"message ai-message";

aiMsg.innerText =
"Thinking...";

chatBox.appendChild(aiMsg);

chatBox.scrollTop =
chatBox.scrollHeight;

try{

// Pollinations AI
const response =
await fetch(
`https://text.pollinations.ai/${encodeURIComponent(prompt)}`
);

const data =
await response.text();

aiMsg.innerText =
data;

speakText(data);

}catch(error){

aiMsg.innerText =
"Error loading AI response.";

}

chatBox.scrollTop =
chatBox.scrollHeight;

}

// Voice Output
function speakText(text){

const speech =
new SpeechSynthesisUtterance();

speech.text = text;

speech.lang = "en-US";

speech.rate = 1;

window.speechSynthesis.speak(
speech
);

}

// Voice Input
const voiceBtn =
document.getElementById(
"voiceBtn"
);

const recognition =
new(window.SpeechRecognition ||
window.webkitSpeechRecognition)();

recognition.lang = "en-US";

voiceBtn.addEventListener(
"click",
()=>{

recognition.start();

}
);

recognition.onresult =
(event)=>{

const transcript =
event.results[0][0].transcript;

promptInput.value =
transcript;

sendMessage();

};

// Online/Offline
const statusDot =
document.getElementById(
"statusDot"
);

function updateStatus(){

if(navigator.onLine){

statusDot.classList.remove(
"offline"
);

}else{

statusDot.classList.add(
"offline"
);

}

}

window.addEventListener(
"online",
updateStatus
);

window.addEventListener(
"offline",
updateStatus
);

updateStatus();

</script>

</body>
</html>
